name: Documentation quality

on:
  push:
    branches: [main, docs/product-map-and-ux-overhaul]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown, links and route inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.17.2 "**/*.md" "#node_modules"
      - name: Check internal documentation links
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-doc-links.mjs 2>&1 | tee link-check-report.txt
      - name: Upload link-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-link-check-report
          path: link-check-report.txt
          if-no-files-found: ignore
      - name: Check canonical route files
        run: node scripts/check-routes.mjs
