name: Verify and deploy Daredevil's Eye

on:
  push:
    branches: [main, feat/first-prototype, feat/reliability-photo-history-push]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daredevils-eye-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

  deploy:
    name: Deploy production Worker
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Check deployment secrets are configured
        id: secrets-check
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" && -n "$GEMINI_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment secrets are present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEMINI_API_KEY in repository Actions secrets."
          fi

      - name: Check out source
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Deploy Worker and upload runtime secrets
        if: steps.secrets-check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Check optional Supabase account-history secrets
        id: account-secrets-check
        if: steps.secrets-check.outputs.configured == 'true'
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          SB_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEY_ENCRYPTION: ${{ secrets.API_KEY_ENCRYPTION_KEY }}
          IP_FINGERPRINT: ${{ secrets.IP_HASH_SECRET }}
        run: |
          if [[ -n "$SB_URL" && -n "$SB_ANON" && -n "$SB_SERVICE" && -n "$KEY_ENCRYPTION" && -n "$IP_FINGERPRINT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Optional Supabase account/history secrets are present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Account/history services remain disabled: configure all five Supabase and encryption secrets to enable them."
          fi

      - name: Upload optional Supabase account-history secrets
        if: steps.account-secrets-check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            API_KEY_ENCRYPTION_KEY
            IP_HASH_SECRET
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_KEY_ENCRYPTION_KEY: ${{ secrets.API_KEY_ENCRYPTION_KEY }}
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}

