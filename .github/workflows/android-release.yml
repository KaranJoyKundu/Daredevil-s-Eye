name: Sign and publish Daredevil's Eye Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (reviewed main commit or release branch)
        required: true
        default: main
      tag_name:
        description: Release tag, for example android-v1.0.0
        required: true
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  signed-release:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Verify Android signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
      - name: Install dependencies
        run: npm install
      - name: Generate and sync Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Apply tracked native Android integration
        run: |
          cp -R native-android/android-app/. android/app/
          cp -R native-android/android-root/. android/ 2>/dev/null || true
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daredevils-eye-release.jks"
      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -p android assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/daredevils-eye-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Prepare checksums and release notes
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DaredevilsEye-Android.apk
          sha256sum DaredevilsEye-Android.apk > SHA256SUMS.txt
          printf '%s\n' "# Daredevil's Eye Android" "" "Galaxy A55-first Capacitor application." "" "Volume Up: Describe · Volume Down: Ask AI · Double Volume Up: Repeat · Hold both: SOS confirmation." "" "Screen-off and global Accessibility Service behaviour are device/OS dependent. See the documentation for limitations." > RELEASE-NOTES.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ inputs.ref || github.sha }}
          name: Daredevil's Eye Android ${{ inputs.tag_name || github.ref_name }}
          body_path: RELEASE-NOTES.md
          files: |
            DaredevilsEye-Android.apk
            SHA256SUMS.txt
