name: Bug report
description: Report a reproducible defect in Daredevil's Eye
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, passwords, private tokens, personal medical data or private camera addresses."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed problem and the expected behaviour.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Page or route
      placeholder: /action/ or /sos/
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Galaxy A55, Android 16, One UI 8
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact personal data and secrets before attaching.
