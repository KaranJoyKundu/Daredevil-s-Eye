<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f"><meta name="description" content="Audio-first camera assistant with large accessible controls.">
<link rel="manifest" href="/manifest.webmanifest"><title>Blind mode · Daredevil's Eye</title>
<link rel="stylesheet" href="/shared/style.css?v=20261126-blind-feedback1">
</head>
<body class="blind-page">
<main id="blind-grid" class="blind-grid" aria-label="Four main actions">
<button class="blind-tile blind-describe" type="button" data-action="describe" aria-label="Describe the camera view" data-bn-label="ক্যামেরার দৃশ্য বর্ণনা করুন"><span aria-hidden="true"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="1"/><path d="M18.944 12.33a1 1 0 0 0 0-.66a7.5 7.5 0 0 0-13.888 0a1 1 0 0 0 0 .66a7.5 7.5 0 0 0 13.888 0"/></g></svg></span><strong data-bn="বর্ণনা">DESCRIBE</strong><small data-bn="আমার চারপাশে কী আছে?">What is around me?</small></button>
<button class="blind-tile blind-ask" type="button" data-action="ask" aria-label="Ask a question by speaking" data-bn-label="কথা বলে প্রশ্ন করুন"><span aria-hidden="true"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 19v3m7-12v2a7 7 0 0 1-14 0v-2"/><rect width="6" height="13" x="9" y="2" rx="3"/></g></svg></span><strong data-bn="প্রশ্ন">ASK AI</strong><small data-bn="কণ্ঠে প্রশ্ন করুন">Ask by voice</small></button>
<button class="blind-tile blind-sos" type="button" data-action="sos" aria-label="SOS. Tap once to arm, tap again to confirm" data-bn-label="এসওএস। একবার চাপলে প্রস্তুত হবে, পাঠাতে আবার চাপুন"><span aria-hidden="true"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233a14 14 0 0 0 6.392 6.384"/></svg></span><strong>SOS</strong><small data-bn="নিশ্চিত করতে দুবার চাপুন">Tap twice to confirm</small></button>
<button class="blind-tile blind-repeat" type="button" data-action="repeat" aria-label="Repeat the last spoken answer" data-bn-label="শেষ উত্তরটি আবার শুনুন"><span aria-hidden="true"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9a9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></g></svg></span><strong data-bn="আবার শুনুন">REPEAT</strong><small data-bn="শেষ উত্তরটি আবার">Hear the last answer again</small></button>
</main>
<p id="blind-feedback" class="blind-action-feedback" role="status" aria-live="polite">Ready. Tap an action to begin.</p>
<p id="sos-feedback" class="sos-feedback" role="status" aria-live="assertive" hidden></p>
<div class="blind-utility" role="group" aria-label="Additional controls"><button id="spoken-help-button" class="blind-help-button" type="button" data-action="help" aria-label="Spoken help. Hear how to use Daredevil's Eye" data-bn-label="কথ্য সহায়তা। অ্যাপটি কীভাবে ব্যবহার করবেন শুনুন" data-bn="কথ্য সহায়তা">SPOKEN HELP</button><button id="sos-trigger-cancel" type="button" data-action="cancel-sos-trigger" hidden>Cancel SOS countdown</button></div>
<div class="sr-only" aria-live="polite" role="status" id="status">Ready. Four main actions: Describe, Ask AI, SOS and Repeat. Spoken Help is separate.</div>
<a id="sos-call-link" class="sr-only" href="#" hidden>Call trusted contact</a>
<input id="phone-photo" class="sr-only" type="file" accept="image/*" capture="environment">
<form id="question-form" class="sr-only"><label for="question">Type a question</label><input id="question" maxlength="1000"><button type="submit">Ask AI</button></form>
<pre id="result" class="sr-only" aria-live="polite"></pre>
<script type="module" src="/shared/app.js?v=20261126-action-startup-fix1"></script><script type="module" src="/shared/site-nav.js?v=20261126-open-access1"></script>
</body></html>
