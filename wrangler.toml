name = "daredevils-eye"
main = "worker/src/index.js"
compatibility_date = "2025-11-13"

[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
APP_ENV = "development"
AI_MODE = "gemini"
GEMINI_MODEL = "gemini-3.8-flash"

[[durable_objects.bindings]]
name = "SOS_ROOM"
class_name = "SOSRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SOSRoom"]

[[durable_objects.bindings]]
name = "SOS_DIRECTORY"
class_name = "SOSDirectory"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SOSDirectory"]
