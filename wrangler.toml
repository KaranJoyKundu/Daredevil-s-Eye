name = "daredevils-eye"
main = "worker/src/index.js"
compatibility_date = "2025-11-13"

[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
APP_ENV = "development"
AI_MODE = "gemini"
GEMINI_MODEL = "gemini-3.8-flash"

[[durable_objects.bindings]]
name = "SOS_ROOM"
class_name = "SOSRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SOSRoom"]

[[durable_objects.bindings]]
name = "SOS_DIRECTORY"
class_name = "SOSDirectory"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SOSDirectory"]

[[ratelimits]]
name = "APP_AUTH_LIMIT"
namespace_id = "2001"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "APP_AI_LIMIT"
namespace_id = "2002"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "APP_SOS_LIMIT"
namespace_id = "2003"
simple = { limit = 90, period = 60 }
